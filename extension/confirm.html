<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuelara — allow access</title>
  <link rel="stylesheet" href="confirm.css">
</head>
<body>
  <main>
    <img src="icons/icon-48.png" alt="" width="40" height="40">
    <h1>Read this site's design?</h1>
    <p class="lead">Cuelara's Site to Prompt wants to open <strong id="site"></strong> and measure its colors, fonts and spacing.</p>
    <p class="muted">Only style measurements are collected. It never reads form fields or cookies, and access ends as soon as the analysis is done.</p>
    <div class="actions">
      <button id="deny" class="btn secondary" type="button">Cancel</button>
      <button id="allow" class="btn primary" type="button">Allow once</button>
    </div>
  </main>
  <script type="module" src="confirm.js"></script>
</body>
</html>
